<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111714">
<title>WebTyper</title>
<style>
:root{color-scheme:dark;--bg:#0e1311;--panel:#161e1a;--surface:#1d2822;--line:#2c3931;--text:#e8eee9;--muted:#97a69b;--accent:#add7b7;--ink:#16291d;--mono:Consolas,"SFMono-Regular",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button,input,select,textarea{outline-offset:4px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}header{border-bottom:1px solid var(--line)}.topbar{max-width:1000px;margin:auto;min-height:76px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px}.brandmark{width:32px;height:32px;display:grid;place-items:center;border:1px solid #65866e;border-radius:8px;color:var(--accent);font:18px var(--mono)}.brandname{font-size:21px;font-weight:700;letter-spacing:-.6px}.header-right{display:flex;align-items:center;gap:18px}.tag{font:10px var(--mono);letter-spacing:.12em;color:var(--muted)}.icon-button{width:44px;height:44px;display:grid;place-items:center;background:transparent;border:1px solid var(--line);border-radius:9px;color:var(--text)}.icon-button:hover{background:var(--surface)}.hamburger{width:18px;display:grid;gap:4px}.hamburger i{display:block;height:1.5px;background:currentColor;border-radius:2px}main{max-width:1000px;margin:auto;padding:28px}.connection{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.status-wrap{display:flex;align-items:center;gap:9px;min-width:0}.dot{height:7px;width:7px;background:#7c8d80;border-radius:50%;flex-shrink:0}.status{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.connection-actions{display:flex;gap:8px;flex-shrink:0}.btn{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);padding:10px 16px;min-height:44px;font-size:13px;font-weight:600}.btn:hover{background:#29382e}.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}.btn-primary:hover{background:#c0e8c9}.btn-quiet{background:transparent;color:var(--muted)}.editor{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}.editor-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}h1{font-size:13px;font-weight:600;margin:0}.toolbar-actions{display:flex;gap:18px}.text-button{border:0;background:transparent;color:var(--muted);padding:8px 0;min-height:36px;font-size:12px}.text-button:hover{color:var(--accent)}.editor-body{padding:22px}.editor-body:focus-within{box-shadow:inset 2px 0 var(--accent)}textarea{display:block;width:100%;min-height:340px;height:45vh;max-height:800px;padding:0;border:0;resize:vertical;background:transparent;color:var(--text);font:16px/1.8 var(--mono);border-radius:0}textarea:focus-visible{outline:none}textarea::placeholder{color:#7b8b80}.editor-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 22px 16px;font-size:11px;color:var(--muted)}.counter{font-family:var(--mono);white-space:nowrap}.sendbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border-top:1px solid var(--line);background:#18221c}.hint{color:var(--muted);font-size:11px;margin:0;line-height:1.8}.send-actions{display:flex;gap:9px}.send-actions .btn-primary{min-width:145px}.arrow{margin-left:20px}.stop{color:#d7b4a6}.activity{margin-top:18px;border:1px solid var(--line);border-radius:10px;background:#121a15}.activity summary{padding:12px 16px;cursor:pointer;color:var(--muted);font-size:12px}.log-body{padding:0 16px 16px;max-height:180px;overflow:auto}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font:12px/1.7 var(--mono)}footer{padding:22px 0 0;font:10px var(--mono);color:#65766b;letter-spacing:.06em;text-align:center}
dialog{position:fixed;inset:0 0 0 auto;margin:0;height:100%;height:100dvh;max-height:none;width:min(360px,100%);max-width:100%;padding:0;background:var(--panel);color:var(--text);border:0;border-left:1px solid var(--line);box-shadow:-16px 0 60px #0005}dialog::backdrop{background:#050907ad;backdrop-filter:blur(3px)}.drawer-heading{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}h2{margin:0;font-size:17px}.drawer-content{padding:25px 22px}.field{margin-bottom:24px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:9px}select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font-size:16px}.checkbox{display:flex;gap:10px;align-items:center;font-size:13px}.checkbox input{accent-color:var(--accent);width:18px;height:18px;margin:0}.drawer-note{border-top:1px solid var(--line);padding-top:20px;margin-top:26px}.drawer-note p+p{margin-top:12px}
@media(max-width:600px){.topbar{min-height:64px;padding:0 16px}.brandname{font-size:20px}.tag{display:none}main{padding:16px 12px}.connection{gap:8px;margin-bottom:14px}.connection-actions{gap:6px}.connection-actions .btn{padding:9px 11px;font-size:12px}.status{font-size:11px}.editor-toolbar{padding:8px 16px}.editor-body{padding:16px}textarea{height:38svh;min-height:220px;font-size:16px}.editor-meta{padding:0 16px 13px;font-size:10px;gap:6px}.sendbar{padding:13px 16px;display:block}.sendbar .hint{margin-bottom:10px;font-size:10px}.send-actions{width:100%}.send-actions .btn-primary{flex:1}.activity{margin-top:14px}footer{padding-top:18px;font-size:9px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="topbar"><div class="brand"><div class="brandmark" aria-hidden="true">w_</div><span class="brandname">WebTyper</span></div><div class="header-right"><span class="tag">BLE → USB HID</span><button id="menuOpen" class="icon-button" aria-label="開啟傳送設定" aria-haspopup="dialog" aria-controls="settingsDrawer" aria-expanded="false"><span class="hamburger" aria-hidden="true"><i></i><i></i><i></i></span></button></div></div></header>
<main>
<div class="connection"><div class="status-wrap"><span class="dot" aria-hidden="true"></span><div id="status" class="status" role="status" aria-live="polite">尚未連線</div></div><div class="connection-actions"><button id="btnConnect" class="btn btn-primary">連接裝置</button><button id="btnDisconnect" class="btn btn-quiet">中斷</button></div></div>
<section class="editor" aria-labelledby="editorTitle"><div class="editor-toolbar"><h1 id="editorTitle">文字輸入</h1><div class="toolbar-actions"><button id="btnPaste" class="text-button">貼上文字</button><button id="btnClear" class="text-button">清空</button></div></div><div class="editor-body"><textarea id="textInput" aria-label="要傳送的文字" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="貼上英文、程式碼或指令…"></textarea></div><div class="editor-meta"><span>英文 / ASCII 符號</span><span class="counter" id="textCount">0 字元 · 1 行</span></div><div class="sendbar"><p class="hint">請將電腦游標放到目標輸入框。</p><div class="send-actions"><button id="btnStop" class="btn btn-quiet stop">停止</button><button id="btnSend" class="btn btn-primary">開始傳送<span class="arrow" aria-hidden="true">↗</span></button></div></div></section>
<details class="activity"><summary>活動記錄</summary><div class="log-body"><pre id="logBox" role="log">等待操作...</pre></div></details>
<footer>WEBTYPER · BLE IN. KEYSTROKES OUT.</footer>
</main>
<dialog id="settingsDrawer" aria-labelledby="settingsTitle"><div class="drawer-heading"><h2 id="settingsTitle">傳送設定</h2><button id="menuClose" class="icon-button" aria-label="關閉傳送設定">✕</button></div><div class="drawer-content"><div class="field"><label for="speed">輸入速度</label><select id="speed"><option value="5">很慢 · 5 字 / 秒</option><option value="10">慢 · 10 字 / 秒</option><option value="20">適中 · 20 字 / 秒</option><option value="35">快 · 35 字 / 秒</option><option value="60">很快 · 60 字 / 秒</option><option value="100">極快 · 100 字 / 秒</option><option value="150">超快 · 150 字 / 秒</option><option value="200" selected>最快 · 200 字 / 秒</option></select></div><div class="field"><label for="imeCommand">輸入法切換快捷鍵</label><select id="imeCommand"><option value="">不切換</option><option value="WIN_SPACE">Windows + Space</option><option value="CTRL_SPACE">Ctrl + Space</option><option value="SHIFT_SPACE">Shift + Space</option><option value="ALT_SHIFT">Alt + Shift</option></select></div><div class="checkbox"><input id="autoIme" type="checkbox"><label for="autoIme">傳送前自動切換輸入法</label></div><div class="drawer-note"><p class="hint">請使用英文輸入模式。原版 USB HID 支援英文與 ASCII 符號，中文與 Emoji 不支援。</p><p class="hint">開發板以 USB 接上目標電腦，再透過網頁連接藍牙。網頁需使用 HTTPS 或 localhost，並以支援 Web Bluetooth 的瀏覽器開啟。</p></div></div></dialog>
<script>
  // ── NUS UUIDs ──
  const NUS_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
  const NUS_RX      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
  const NUS_TX      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

  const ACK_TIMEOUT = 1000;
  const CHUNK_SIZE  = 18;  // 字元數 → base64 24B，減少來回次數
  const SEG_SIZE    = 1000; // 每段字元數，夠大讓 pipeline 有效

  let device = null, rxChar = null, txChar = null;
  let busy = false, stopFlag = false;
  let ackResolve = null, doneResolve = null;

  const enc = new TextEncoder(), dec = new TextDecoder();
  const statusEl  = document.getElementById('status');
  const logBox    = document.getElementById('logBox');
  const textInput = document.getElementById('textInput');
  const speedEl   = document.getElementById('speed');
  const autoImeEl = document.getElementById('autoIme');
  const imeCmdEl  = document.getElementById('imeCommand');
  function log(msg) {
    const t = new Date().toLocaleTimeString();
    logBox.textContent += `\n[${t}] ${msg}`;
    logBox.parentElement.scrollTop = logBox.parentElement.scrollHeight;
  }
  function setStatus(msg) { statusEl.textContent = msg; }
  function isConnected() { return !!(device?.gatt?.connected && rxChar && txChar); }

  // 打字進度顯示
  let typingText = '';
  let typingPos = 0;
  let typingInterval = null;

  function startTypingSync(text, cps) {
    typingText = text;
    typingPos = 0;
    clearInterval(typingInterval);
    const delay = cps > 0 ? Math.max(10, 1000 / cps) : 50;
    typingInterval = setInterval(() => {
      if (typingPos >= typingText.length) { clearInterval(typingInterval); return; }
      typingPos++;
      const preview = typingText.slice(0, typingPos);
      logBox.textContent = `傳送「${preview}」`;
      logBox.parentElement.scrollTop = logBox.parentElement.scrollHeight;
    }, delay);
  }

  function stopTypingSync() {
    clearInterval(typingInterval);
    typingInterval = null;
  }

  // ── BLE 傳送 ──
  async function sendLine(line) {
    const data = enc.encode(line + '\n');
    log(`TX → ${line}`);
    try { await rxChar.writeValue(data); }
    catch { await rxChar.writeValueWithoutResponse(data); }
  }

  function waitAck() {
    return new Promise(resolve => {
      const t = setTimeout(() => { ackResolve = null; log('⚠ ACK timeout'); resolve(false); }, ACK_TIMEOUT);
      ackResolve = ok => { clearTimeout(t); ackResolve = null; resolve(ok); };
    });
  }

  async function sendAndAck(line) { const p = waitAck(); await sendLine(line); return p; }

  function waitDone() {
    return new Promise(resolve => {
      const t = setTimeout(() => { doneResolve = null; resolve(); }, 60000);
      doneResolve = () => { clearTimeout(t); doneResolve = null; resolve(); };
    });
  }

  function onNotify(event) {
    const text = dec.decode(new Uint8Array(event.target.value.buffer)).trim();
    if (text === 'READY') return;
    if (text === 'DONE') {
      stopTypingSync();
      logBox.textContent = '傳送完成';
      logBox.parentElement.scrollTop = logBox.parentElement.scrollHeight;
      doneResolve?.(); return;
    }
    if (text === 'OK')  ackResolve?.(true);
    if (text === 'ERR') ackResolve?.(false);
  }

  // ── 連線 ──
  async function connectBle() {
    if (!navigator.bluetooth) throw new Error('此瀏覽器不支援 Web Bluetooth');
    setStatus('搜尋裝置...');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [NUS_SERVICE] }], optionalServices: [NUS_SERVICE]
    });
    device.addEventListener('gattserverdisconnected', () => {
      setStatus('已中斷'); log('藍牙已中斷'); rxChar = txChar = null;
    });
    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(NUS_SERVICE);
    rxChar = await service.getCharacteristic(NUS_RX);
    txChar = await service.getCharacteristic(NUS_TX);
    await txChar.startNotifications();
    txChar.addEventListener('characteristicvaluechanged', onNotify);
    setStatus(`已連線：${device.name || '未命名'}`);
    logBox.textContent = '連線成功';
  }

  // ── 傳送一段（pipeline：送完 END 不等 DONE）──
  async function sendSegment(seg, cps, switchIme, imeCmd) {
    if (!await sendAndAck(`BEGIN ${cps} ${switchIme} ${imeCmd} 0`)) throw new Error('BEGIN 未收到 ACK');
    for (let i = 0; i < seg.length; i += CHUNK_SIZE) {
      if (stopFlag) { await sendLine('STOP'); return false; }
      const encoded = btoa(seg.slice(i, i + CHUNK_SIZE));
      if (!await sendAndAck(`DATA ${encoded}`)) throw new Error('DATA 未收到 ACK');
    }
    if (!await sendAndAck('END')) throw new Error('END 未收到 ACK');
    return true;
  }

  // ── 傳送全部 ──
  async function sendTypingJob() {
    if (busy) return;
    if (!isConnected()) throw new Error('請先連線');
    const raw = textInput.value;
    if (!raw.trim()) throw new Error('請先輸入文字');
    const text = raw;
    busy = true; stopFlag = false;
    const cps = Number(speedEl.value);
    const switchIme = autoImeEl.checked ? '1' : '0';
    const imeCmd = imeCmdEl.value || 'NONE';
    const total = text.length;
    let sent = 0;
    logBox.textContent = `傳送「」`;
    for (let i = 0; i < total; i += SEG_SIZE) {
      if (stopFlag) break;
      const seg = text.slice(i, i + SEG_SIZE);
      setStatus(`傳送中 ${sent}/${total}`);
      const segIme = (i === 0) ? switchIme : '0';
      await sendSegment(seg, cps, segIme, imeCmd);
      sent += seg.length;
    }
    // 所有資料傳完，開發板開始打字，此時才開始同步顯示
    startTypingSync(text, cps);
    await waitDone();
    setStatus('完成'); busy = false;
  }

  // ── 事件綁定 ──
  document.getElementById('btnConnect').addEventListener('click', async () => {
    try { await connectBle(); } catch (e) { logBox.textContent = '連線失敗：' + e.message; setStatus('連線失敗'); }
  });
  document.getElementById('btnDisconnect').addEventListener('click', () => device?.gatt?.disconnect());
  document.getElementById('btnSend').addEventListener('click', async () => {
    try { await sendTypingJob(); }
    catch (e) { stopTypingSync(); busy = false; logBox.textContent = '傳送失敗：' + e.message; setStatus('傳送失敗'); }
  });
  document.getElementById('btnStop').addEventListener('click', async () => {
    stopFlag = true; stopTypingSync();
    try { await sendLine('STOP'); logBox.textContent = '已停止'; } catch (e) { logBox.textContent = 'STOP 失敗：' + e.message; }
  });
  document.getElementById('btnPaste').addEventListener('click', async () => {
    try {
      if (!navigator.clipboard?.readText) throw new Error('瀏覽器不支援剪貼簿讀取');
      const text = await navigator.clipboard.readText();
      textInput.value = text;
      logBox.textContent = `已貼上文字（${text.length} 字元）`;
    } catch (e) {
      logBox.textContent = '貼上失敗：' + e.message;
    }
  });
  document.getElementById('btnClear').addEventListener('click', () => { textInput.value = ''; logBox.textContent = '已清空'; });

  // 頁面就緒
  window.addEventListener('load', () => {
    logBox.textContent = '頁面已就緒';
  });
</script>
<script>
const drawer = document.getElementById('settingsDrawer');
const menuOpen = document.getElementById('menuOpen');
menuOpen.addEventListener('click', () => { drawer.showModal(); menuOpen.setAttribute('aria-expanded', 'true'); });
document.getElementById('menuClose').addEventListener('click', () => drawer.close());
drawer.addEventListener('close', () => { menuOpen.setAttribute('aria-expanded', 'false'); menuOpen.focus(); });
drawer.addEventListener('click', event => {
  const bounds = drawer.getBoundingClientRect();
  if (event.target === drawer && (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom)) drawer.close();
});
const updateCount = () => {
  const value = document.getElementById('textInput').value;
  document.getElementById('textCount').textContent = `${Array.from(value).length.toLocaleString()} 字元 · ${value.split('\n').length.toLocaleString()} 行`;
};
document.getElementById('textInput').addEventListener('input', updateCount);
new MutationObserver(updateCount).observe(document.getElementById('logBox'), {childList:true, subtree:true, characterData:true});
</script>
</body>
</html>
